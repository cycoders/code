[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raft-consensus-simulator"
version = "0.1.0"
description = "Raft consensus algorithm simulator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["typer>=0.9", "rich>=13", "pydantic>=2"]

[project.scripts]
raft-consensus-simulator = "raft_consensus_simulator.cli:app"