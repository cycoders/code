[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-data-synthesizer"
version = "0.1.0"
description = "Schema-aware synthetic test data generator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["click>=8.1", "numpy>=1.26", "pyarrow>=15.0", "faker>=24.0", "jsonschema>=4.21", "sqlglot>=23.0", "pyyaml>=6.0", "rich>=13.0"]

[project.scripts]
test-data-synthesizer = "test_data_synthesizer.cli:main"