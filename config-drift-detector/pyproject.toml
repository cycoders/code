[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "config-drift-detector"
version = "0.1.0"
description = "Semantic configuration drift detector"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.0", "pyyaml>=6.0", "tomli>=2.0", "pydantic>=2.0"]

[project.scripts]
config-drift-detector = "config_drift_detector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
