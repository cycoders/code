[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canonical-json-toolkit"
version = "0.1.0"
description = "Deterministic canonical JSON per RFC 8785"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["typer>=0.9", "rich>=13"]

[project.scripts]
canonical-json = "canonical_json_toolkit.cli:app"