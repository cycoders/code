[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coroutine-lifetime-analyzer"
version = "0.1.0"
description = "Detects leaked coroutines and improper task lifetimes in asyncio code"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["rich>=13.7", "typer>=0.9"]

[project.scripts]
coroutine-lifetime-analyzer = "coroutine_lifetime_analyzer.cli:app"