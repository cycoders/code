[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdr-histogram-cli"
version = "0.1.0"
description = "HDR Histogram analysis CLI"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.0", "numpy>=1.24"]

[project.scripts]
hdr-histogram-cli = "hdr_histogram_cli.cli:cli"