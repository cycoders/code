[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magic-number-inspector"
version = "0.1.0"
description = "Identify file types via magic bytes and structural analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["rich>=13.7", "typer>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "mypy"]

[project.scripts]
magic-number-inspector = "magic_number_inspector.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/magic_number_inspector"]

[tool.ruff]
target-version = "py311"