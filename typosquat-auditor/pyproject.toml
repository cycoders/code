[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typosquat-auditor"
version = "0.1.0"
description = "Detect PyPI typosquatting"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.0", "python-Levenshtein>=0.21"]

[project.scripts]
typosquat-auditor = "typosquat_auditor.cli:cli"