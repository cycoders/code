[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sri-hash-generator"
version = "0.1.0"
description = "SRI hash generator and updater for web assets"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["typer>=0.9", "rich>=13", "beautifulsoup4>=4.12"]

[project.scripts]
sri-hash-generator = "sri_hash_generator.cli:app"