[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotenv-linter"
version = "0.1.0"
description = "Production-grade .env file linter and auto-fixer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["rich>=13.7", "click>=8.1"]

[project.scripts]
dotenv-linter = "dotenv_linter.cli:cli"