[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copyleft-risk-analyzer"
version = "0.1.0"
description = "Detect copyleft license obligations across dependency graphs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.0", "pyyaml>=6.0", "spdx-tools>=0.8"]

[project.scripts]
copyleft-risk-analyzer = "copyleft_risk_analyzer.cli:cli"