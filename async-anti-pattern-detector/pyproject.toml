[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "async-anti-pattern-detector"
version = "0.1.0"
description = "Detect async/await anti-patterns with fixes"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["libcst>=1.2.0", "rich>=13.0", "click>=8.1"]

[project.scripts]
async-anti-pattern-detector = "async_anti_pattern_detector.cli:main"