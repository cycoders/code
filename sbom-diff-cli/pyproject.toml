[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbom-diff-cli"
version = "0.1.0"
description = "Compare SBOMs with vulnerability context and policy gates"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["typer>=0.9", "rich>=13", "cyclonedx-python-lib>=5.0", "spdx-tools>=0.8", "pydantic>=2.0"]

[project.scripts]
sbom-diff-cli = "sbom_diff_cli.cli:app"