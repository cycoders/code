[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "db-connection-leak-detector"
version = "0.1.0"
description = "Detect database connection leaks via static + runtime analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["libcst>=1.1", "rich>=13.7", "click>=8.1", "typing-extensions>=4.9"]

[project.scripts]
db-connection-leak-detector = "db_connection_leak_detector.cli:main"