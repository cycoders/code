[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lamport-clock-analyzer"
version = "0.1.0"
description = "Analyze Lamport timestamps in distributed logs"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.7", "pyyaml>=6.0", "networkx>=3.2"]

[project.scripts]
lamport-clock-analyzer = "lamport_clock_analyzer.cli:cli"