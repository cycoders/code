[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "histogram-merger"
version = "0.1.0"
description = "Merge latency histograms from distributed services"
authors = [{name = "Arya Sianati"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.0"]

[project.scripts]
histogram-merger = "histogram_merger.cli:cli"