[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ast-query-cli"
version = "0.1.0"
description = "AST pattern queries for Python codebases"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["typer>=0.9", "rich>=13"]

[project.scripts]
ast-query-cli = "ast_query_cli.cli:app"