[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structured-log-validator"
version = "0.1.0"
description = "Validate structured logs against JSON schemas"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.0", "jsonschema>=4.21", "orjson>=3.9"]

[project.scripts]
structured-log-validator = "structured_log_validator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"