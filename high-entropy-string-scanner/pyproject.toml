[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "high-entropy-string-scanner"
version = "0.1.0"
description = "High-precision secret scanner using entropy and context"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["click>=8.1", "pyyaml>=6.0", "rich>=13.0"]

[project.scripts]
high-entropy-string-scanner = "high_entropy_string_scanner.cli:cli"