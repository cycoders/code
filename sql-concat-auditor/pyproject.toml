[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sql-concat-auditor"
version = "0.1.0"
description = "Detect unsafe SQL string concatenation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["rich>=13", "typer>=0.9"]

[project.scripts]
sql-concat-auditor = "sql_concat_auditor.cli:app"