[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thread-pool-calibrator"
version = "0.1.0"
description = "Optimal thread pool size calibration via simulation and profiling"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["click>=8.1", "rich>=13.0", "numpy>=1.24", "pyyaml>=6.0"]

[project.scripts]
thread-pool-calibrator = "thread_pool_calibrator.cli:cli"