[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "symlink-analyzer-cli"
version = "0.1.0"
description = "Deep symlink analysis and repair for large codebases"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Arya Sianati"}]
requires-python = ">=3.11"
dependencies = ["rich>=13.7", "typer>=0.9", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
symlink-analyzer = "symlink_analyzer_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/symlink_analyzer_cli"]