[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "correlation-id-auditor"
version = "0.1.0"
description = "Audit correlation ID propagation across async, queues and HTTP clients"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["libcst>=1.1", "rich>=13.7", "typer>=0.9", "sarif-om>=1.3"]

[project.scripts]
correlation-id-auditor = "correlation_id_auditor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/correlation_id_auditor"]