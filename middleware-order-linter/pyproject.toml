[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "middleware-order-linter"
version = "0.1.0"
description = "Detect unsafe middleware ordering"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["typer>=0.9", "rich>=13", "pyyaml>=6.0"]

[project.scripts]
middleware-order-linter = "middleware_order_linter.cli:app"